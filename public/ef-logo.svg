<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient (Deep Royal Purple) -->
    <radialGradient id="bg-leather" cx="50%" cy="46%" r="58%">
      <stop offset="0%" stop-color="#2d1354"/>
      <stop offset="45%" stop-color="#1b0a33"/>
      <stop offset="85%" stop-color="#100520"/>
      <stop offset="100%" stop-color="#0a0214"/>
    </radialGradient>

    <!-- Metallic Purple Outer Bevel Gradient -->
    <linearGradient id="purple-chrome" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#d946ef"/>
      <stop offset="18%" stop-color="#8b5cf6"/>
      <stop offset="35%" stop-color="#c084fc"/>
      <stop offset="52%" stop-color="#581c87"/>
      <stop offset="70%" stop-color="#a855f7"/>
      <stop offset="88%" stop-color="#3b0764"/>
      <stop offset="100%" stop-color="#c026d3"/>
    </linearGradient>

    <!-- Chrome Rim Specular Flare Gradient -->
    <linearGradient id="rim-flare" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e879f9" stop-opacity="0"/>
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="75%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#e879f9" stop-opacity="0"/>
    </linearGradient>

    <!-- EF Gradient (Bright Lavender to Royal Purple with 3D Bevel) -->
    <linearGradient id="ef-serif-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0abfc"/>
      <stop offset="15%" stop-color="#e879f9"/>
      <stop offset="45%" stop-color="#c084fc"/>
      <stop offset="75%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>

    <!-- Silver Chrome Text Gradient (CPA SHOP & TOP-UP) -->
    <linearGradient id="silver-metal-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="22%" stop-color="#f1f5f9"/>
      <stop offset="45%" stop-color="#cbd5e1"/>
      <stop offset="68%" stop-color="#94a3b8"/>
      <stop offset="88%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Silver Coin Top Ellipse Gradient -->
    <linearGradient id="coin-face-grad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#e2e8f0"/>
      <stop offset="75%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Silver Coin Standing Face -->
    <radialGradient id="coin-stand-grad" cx="42%" cy="40%" r="58%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#e2e8f0"/>
      <stop offset="70%" stop-color="#cbd5e1"/>
      <stop offset="90%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </radialGradient>

    <!-- Gamepad Purple Gradient -->
    <linearGradient id="pad-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="30%" stop-color="#9333ea"/>
      <stop offset="75%" stop-color="#6b21a8"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>

    <!-- Filters for Realistic 3D Emboss & Shadows -->
    <filter id="badge-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#7c3aed" flood-opacity="0.3"/>
    </filter>

    <filter id="text-3d" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="icon-3d" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.75"/>
    </filter>

    <filter id="flare-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- SQUIRCLE APP ICON CONTAINER -->
  <g filter="url(#badge-shadow)">
    <!-- Main Background -->
    <rect x="52" y="52" width="408" height="408" rx="88" ry="88" fill="url(#bg-leather)"/>

    <!-- Subtle Texture Inset Pattern -->
    <rect x="56" y="56" width="400" height="400" rx="84" ry="84" fill="none" stroke="#381363" stroke-width="2" opacity="0.6"/>
    <rect x="62" y="62" width="388" height="388" rx="78" ry="78" fill="none" stroke="#1f0938" stroke-width="1.5" opacity="0.8"/>

    <!-- Inner Metallic Inset Line -->
    <rect x="66" y="66" width="380" height="380" rx="74" ry="74" fill="none" stroke="#6b21a8" stroke-width="2.5" opacity="0.9"/>

    <!-- HEAVY PURPLE CHROME DOUBLE BEVELED FRAME -->
    <rect x="52" y="52" width="408" height="408" rx="88" ry="88" fill="none" stroke="url(#purple-chrome)" stroke-width="16"/>

    <!-- Outer Chrome Edge Highlight -->
    <rect x="44" y="44" width="424" height="424" rx="96" ry="96" fill="none" stroke="#7e22ce" stroke-width="2" opacity="0.7"/>

    <!-- TOP SPECULAR REFLECTION FLARE -->
    <g filter="url(#flare-glow)">
      <path d="M 185 46 Q 256 42 327 46 Q 256 50 185 46 Z" fill="url(#rim-flare)"/>
      <circle cx="256" cy="46" r="3" fill="#ffffff"/>
    </g>

    <!-- BOTTOM SPECULAR REFLECTION FLARE -->
    <g filter="url(#flare-glow)">
      <path d="M 205 466 Q 256 463 307 466 Q 256 469 205 466 Z" fill="url(#rim-flare)" opacity="0.85"/>
      <circle cx="256" cy="466" r="2.5" fill="#ffffff" opacity="0.9"/>
    </g>
  </g>

  <!-- ============================================== -->
  <!-- LEFT: 3D PURPLE GAME CONTROLLER               -->
  <!-- ============================================== -->
  <g transform="translate(102, 172)" filter="url(#icon-3d)">
    <!-- Controller Body -->
    <path d="M 14 26 C 14 12, 26 8, 42 8 C 53 8, 61 12, 64 16 C 67 12, 75 8, 86 8 C 102 8, 114 12, 114 26 C 114 44, 102 66, 88 66 C 79 66, 75 58, 64 58 C 53 58, 49 66, 40 66 C 26 66, 14 44, 14 26 Z"
          fill="url(#pad-grad)"
          stroke="#e879f9"
          stroke-width="1.8"/>

    <!-- Top Gloss Highlight -->
    <path d="M 22 20 C 30 14, 45 13, 60 17" fill="none" stroke="#f5d0fe" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
    <path d="M 68 17 C 83 13, 98 14, 106 20" fill="none" stroke="#f5d0fe" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>

    <!-- Left: Cross D-Pad -->
    <path d="M 31 23 h 8 v -7 h 6 v 7 h 8 v 6 h -8 v 7 h -6 v -7 h -8 Z"
          fill="#1b0833"
          stroke="#d946ef"
          stroke-width="1"/>
    <!-- D-pad center dot -->
    <circle cx="38" cy="26" r="1.2" fill="#c084fc"/>

    <!-- Right: 4 Action Buttons in Diamond Shape -->
    <circle cx="89" cy="20" r="3.2" fill="#1b0833" stroke="#f0abfc" stroke-width="1.2"/>
    <circle cx="98" cy="26" r="3.2" fill="#1b0833" stroke="#f0abfc" stroke-width="1.2"/>
    <circle cx="80" cy="26" r="3.2" fill="#1b0833" stroke="#f0abfc" stroke-width="1.2"/>
    <circle cx="89" cy="32" r="3.2" fill="#1b0833" stroke="#f0abfc" stroke-width="1.2"/>
  </g>

  <!-- ============================================== -->
  <!-- CENTER: "EF" IN LUXURY ROMAN SERIF (3D BEVEL)  -->
  <!-- ============================================== -->
  <g filter="url(#text-3d)">
    <!-- Roman Serif 'EF' with high-contrast serifs matching user logo -->
    <text x="256" y="224"
          font-family="'Playfair Display', 'Times New Roman', 'Georgia', serif"
          font-size="126"
          font-weight="900"
          font-style="normal"
          fill="url(#ef-serif-grad)"
          stroke="#f5d0fe"
          stroke-width="1.6"
          text-anchor="middle"
          letter-spacing="2">EF</text>
  </g>

  <!-- ============================================== -->
  <!-- RIGHT: STACK OF SILVER COINS WITH $ SIGN       -->
  <!-- ============================================== -->
  <g transform="translate(334, 160)" filter="url(#icon-3d)">
    <!-- Coin 1 (Bottom of Stack) -->
    <ellipse cx="66" cy="62" rx="27" ry="10" fill="url(#coin-face-grad)" stroke="#ffffff" stroke-width="1"/>
    <path d="M 39 62 v 7 c 0 5.5 12 10 27 10 s 27 -4.5 27 -10 v -7" fill="#475569" stroke="#94a3b8" stroke-width="1"/>

    <!-- Coin 2 -->
    <ellipse cx="66" cy="52" rx="27" ry="10" fill="url(#coin-face-grad)" stroke="#ffffff" stroke-width="1"/>
    <path d="M 39 52 v 7 c 0 5.5 12 10 27 10 s 27 -4.5 27 -10 v -7" fill="#475569" stroke="#94a3b8" stroke-width="1"/>

    <!-- Coin 3 -->
    <ellipse cx="66" cy="42" rx="27" ry="10" fill="url(#coin-face-grad)" stroke="#ffffff" stroke-width="1"/>
    <path d="M 39 42 v 7 c 0 5.5 12 10 27 10 s 27 -4.5 27 -10 v -7" fill="#475569" stroke="#94a3b8" stroke-width="1"/>

    <!-- Coin 4 (Top of Stack) -->
    <ellipse cx="66" cy="32" rx="27" ry="10" fill="url(#coin-face-grad)" stroke="#ffffff" stroke-width="1.2"/>

    <!-- PROPPED FRONT COIN WITH EMBOSSED '$' SIGN -->
    <!-- Drop shadow for the front coin onto the stack -->
    <ellipse cx="44" cy="49" rx="24" ry="25" fill="#000000" opacity="0.4"/>
    <!-- Front Coin Body -->
    <ellipse cx="42" cy="47" rx="25" ry="26" fill="url(#coin-stand-grad)" stroke="#ffffff" stroke-width="2.2"/>
    <!-- Inner Coin Rim -->
    <ellipse cx="42" cy="47" rx="20.5" ry="21.5" fill="none" stroke="#64748b" stroke-width="1.4" stroke-dasharray="3,1.5"/>
    <ellipse cx="42" cy="47" rx="18.5" ry="19.5" fill="none" stroke="#94a3b8" stroke-width="0.8"/>

    <!-- Embossed Dollar Sign ($) -->
    <text x="42" y="56"
          font-family="'Arial Black', 'Impact', sans-serif"
          font-size="26"
          font-weight="900"
          fill="#1e293b"
          stroke="#475569"
          stroke-width="0.8"
          text-anchor="middle">$</text>
  </g>

  <!-- ============================================== -->
  <!-- TEXT: "CPA SHOP" (EMBOSSED 3D METALLIC SILVER) -->
  <!-- ============================================== -->
  <g filter="url(#text-3d)">
    <text x="256" y="286"
          font-family="'Montserrat', 'Arial Black', 'Prompt', sans-serif"
          font-size="54"
          font-weight="900"
          letter-spacing="2.5"
          fill="url(#silver-metal-grad)"
          stroke="#ffffff"
          stroke-width="1.8"
          text-anchor="middle">CPA SHOP</text>
  </g>

  <!-- ============================================== -->
  <!-- TEXT: "TOP-UP" (CRISP METALLIC SILVER)         -->
  <!-- ============================================== -->
  <g filter="url(#text-3d)">
    <text x="256" y="328"
          font-family="'Montserrat', 'Arial Black', 'Prompt', sans-serif"
          font-size="28"
          font-weight="900"
          letter-spacing="9"
          fill="url(#silver-metal-grad)"
          stroke="#ffffff"
          stroke-width="1"
          text-anchor="middle">TOP-UP</text>
  </g>
</svg>
